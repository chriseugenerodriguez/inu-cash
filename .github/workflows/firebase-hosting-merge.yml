# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ./app/node_modules
          key: modules-${{ hashFiles('./app/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm --prefix app ci --ignore-scripts

      - name: Install trading dependencies
        run: npm --prefix trading/swap ci

      - name: Validate trading app
        run: npm run lint:trading && npm run test:trading

      - name: Build
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_INU_CASH_DEB36 }}"
          channelId: live
          projectId: inu-cash-deb36
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
