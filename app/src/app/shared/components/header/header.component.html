<header class="site-header static-top">
  <nav class="container d-flex flex-column flex-md-row justify-content-between">
    <a [class.header-top]="!top" [class.cursor-default]="top" [routerLinkActive]="['active']"
      [routerLinkActiveOptions]="{exact:true}" [routerLink]="['/']">
      <img (click)='scrollTop()' src="./assets/svg/logo.svg" alt="Inu Cash" />
    </a>
    <a href="/#roadmap" (click)="scrollToSection($event, 'roadmap')">RoadMap</a>
    <a href="/#tokenomics" (click)="scrollToSection($event, 'tokenomics')">Tokenomics</a>
    <a href="/#donate" (click)="scrollToSection($event, 'donate')">Donate</a>
    <a href="/trade/">Trade</a>
    <a class="btn btn-primary small" href="https://chriseugenerodriguez.com">Buy</a>
  </nav>
</header>
